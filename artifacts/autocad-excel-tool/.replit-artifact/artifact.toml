kind = "web"
previewPath = "/"
title = "AutoCAD Excel Tool"
version = "1.0.0"
id = "artifacts/autocad-excel-tool"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25943

[services.development]
run = "pnpm --filter @workspace/autocad-excel-tool run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/autocad-excel-tool", "run", "build" ]
publicDir = "artifacts/autocad-excel-tool/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25943"
BASE_PATH = "/"
